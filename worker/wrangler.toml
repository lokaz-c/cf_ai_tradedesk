name = "cf-ai-tradedesk"
main = "src/index.ts"
compatibility_date = "2024-11-06"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TRADE_SESSION"
class_name = "TradeSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradeSession"]

[[d1_databases]]
binding = "DB"
database_name = "tradedesk-db"
database_id = "91783c8c-6107-4627-8dc3-75c0d1071c4c"
# Schema migrations live at the repo root, shared with the tests.
migrations_dir = "../migrations"

# Limits for the public demo; see "Limits" in the README. Numbers are read as
# integers, and a missing or invalid value falls back to the same default in
# src/limits.ts (ALLOWED_ORIGINS: src/http.ts).
[vars]
# Browser origins allowed to call the API: comma-separated, exact match. The
# Vite dev server proxies /api, so local development sends its own origin.
ALLOWED_ORIGINS = "https://cf-ai-tradedesk.pages.dev,http://localhost:5173"
# Longest chat message accepted, in characters. Longer messages get 413.
MAX_MESSAGE_CHARS = 2000
# Stored conversation sent with each request: the newest messages, at most 20
# and at most this many characters in total.
MAX_HISTORY_CHARS = 6000
# max_tokens for each reply.
MAX_OUTPUT_TOKENS = 512
# Retry-After on a per-IP 429. Keep it equal to ratelimits.simple.period.
RATE_LIMIT_PERIOD_SECONDS = 60

# Per-IP limit on POST /api/session/:id/chat (Workers Rate Limiting binding).
# Counted per Cloudflare location; period must be 10 or 60 seconds.
# namespace_id is any integer unique within the Cloudflare account.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
