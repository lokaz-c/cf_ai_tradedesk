name = "cf-ai-tradedesk"
main = "src/index.ts"
compatibility_date = "2024-11-06"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "TRADE_SESSION"
class_name = "TradeSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradeSession"]

[[d1_databases]]
binding = "DB"
database_name = "tradedesk-db"
database_id = "91783c8c-6107-4627-8dc3-75c0d1071c4c"
# Schema migrations live at the repo root, shared with the tests.
migrations_dir = "../migrations"

# Limits for the public demo; see "Limits" in the README. Numbers are read as
# integers, and a missing or invalid value falls back to the same default in
# src/limits.ts (ALLOWED_ORIGINS: src/http.ts).
[vars]
# Browser origins allowed to call the API: comma-separated, exact match. The
# Vite dev server proxies /api, so local development sends its own origin.
ALLOWED_ORIGINS = "https://cf-ai-tradedesk.pages.dev,http://localhost:5173"
# Longest chat message accepted, in characters. Longer messages get 413.
MAX_MESSAGE_CHARS = 2000
# Stored conversation sent with each request: the newest messages, at most 20
# and at most this many characters in total.
MAX_HISTORY_CHARS = 6000
# max_tokens for each reply.
MAX_OUTPUT_TOKENS = 512
# Chat requests accepted per UTC day across all users (counted in D1).
# 0 turns chat off.
DAILY_CHAT_BUDGET = 200
# Retry-After on a per-IP 429. Keep it equal to ratelimits.simple.period.
RATE_LIMIT_PERIOD_SECONDS = 60

# Grounding: the market-data service (github.com/lokaz-c/market-data) that
# supplies every price level. Empty turns grounding off: the model is told it
# has no price data. Set it to the service's base URL, e.g.
# MARKET_DATA_URL = "https://market-data.example.com". An optional API key is
# a secret, never a var: `npx wrangler secret put MARKET_DATA_API_KEY`. Give
# TradeDesk a key with only the `rate-limit` scope: it lifts market-data's
# per-IP limit and still sees only synthetic data.
MARKET_DATA_URL = ""
# The market-data `source` values TradeDesk may show, comma-separated.
# Alpaca's terms forbid public display of its data without written consent,
# so only synthetic data is shown unless this lists alpaca as well.
MARKET_DATA_DISPLAY_SOURCES = "synthetic"
# Timeout for each market-data request, in milliseconds.
MARKET_DATA_TIMEOUT_MS = 4000
# Non-streamed tool rounds before the streamed answer (1-4).
MAX_TOOL_ROUNDS = 1

# Backtest tool: the quant backtester (github.com/lokaz-c/quant). Empty turns
# the tool off. Set it to the API's base URL, e.g.
# QUANT_API_URL = "https://quant.example.com". An optional API key, whose
# SHA-256 digest is in quant's QUANT_API_KEY_SHA256, lifts quant's per-address
# rate limits: `npx wrangler secret put QUANT_API_KEY`.
QUANT_API_URL = ""
# How long to wait for quant to finish a backtest, in milliseconds (100 to
# 120000). quant runs the backtest inside the request, so this covers the
# whole run. quant's `make deploy-check` ran its default request (5 symbols,
# one year, with a baseline) in 52.7 s at Render's free size, and quant stops
# a run itself at 90 s (504).
QUANT_TIMEOUT_MS = 60000
# Backtests accepted per UTC day across all users (counted in D1).
# 0 turns the backtest tool off.
DAILY_BACKTEST_BUDGET = 20

# Per-IP limit on POST /api/session/:id/chat (Workers Rate Limiting binding).
# Counted per Cloudflare location; period must be 10 or 60 seconds.
# namespace_id is any integer unique within the Cloudflare account.
[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Per-IP limit on backtests, checked when the model calls run_backtest.
# Tighter than chat: each one runs a full backtest on quant.
[[ratelimits]]
name = "BACKTEST_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

# Per-IP limit on the chart panel's routes (GET /api/market/*), which call
# market-data. They cost no model call; this keeps one client from using up
# market-data's own rate limit for everyone.
[[ratelimits]]
name = "MARKET_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }
